# ═══════════════════════════════════════════════════════════════════════════════
# JobAI — Docker Compose
#
# MODE 3 (Together — default): Frontend + Backend on the same host.
#   Nginx on :80/:443 proxies /api → backend, serves /dist for everything else.
#
# MODE 4 (Separated): Run backend only, deploy frontend elsewhere.
#   docker compose up -d backend
#
# Before starting:
#   cp backend/.env.production .env   # fill in secrets
#   cd frontend && npm ci && npm run build && cd ..  # build frontend
#   docker compose up -d --build
# ═══════════════════════════════════════════════════════════════════════════════

version: '3.9'

services:

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: jobai-backend
    restart: unless-stopped
    ports:
      - "5000:5000"           # expose directly (useful for Mode 4 / API-only)
    env_file:
      - .env                  # single source of truth — copy from backend/.env.production
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_PATH: /app/data/jobai.db
    volumes:
      - jobai-db:/app/data
      - jobai-uploads:/app/uploads
      - jobai-logs:/app/logs
    command: >
      sh -c "node src/database/setup.js && node src/server.js"
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - |
          require('http').get('http://localhost:5000/api/health', r => {
            let d = '';
            r.on('data', c => d += c);
            r.on('end', () => {
              try {
                const j = JSON.parse(d);
                process.exit(j.status === 'healthy' && j.database?.ok ? 0 : 1);
              } catch { process.exit(1); }
            });
          }).on('error', () => process.exit(1));
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # ── Frontend (Mode 3 only — comment out for Mode 4) ─────────────────────────
  frontend:
    image: nginx:alpine
    container_name: jobai-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  jobai-db:
  jobai-uploads:
  jobai-logs:
