# ─────────────────────────────────────────────────────────────────────────────
# JobAI — Nginx config for Docker (Mode 3: together on same host)
#
# This file is mounted inside the nginx:alpine container.
# The backend is reachable at http://backend:5000 (Docker DNS).
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── SPA routing ────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively (Vite adds content hashes)
        location ~* \.(js|css|woff2?|svg|png|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── API proxy → backend container ──────────────────────────────────────
    # "backend" resolves via Docker Compose internal DNS
    location /api/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;     # AI endpoints can take up to 60 s
        client_max_body_size 10M;    # matches backend multer limit
    }

    # ── Gzip ───────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml
               application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;
}
